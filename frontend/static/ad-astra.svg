<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ad Astra tracker icon</title>
  <desc id="desc">A dimensional celestial compass dial with a radiant four-point star and progress markers.</desc>
  <defs>
    <linearGradient id="rim" x1=".12" y1=".05" x2=".9" y2=".95">
      <stop offset="0" stop-color="#F4E5C1"/><stop offset=".38" stop-color="#B9A17B"/><stop offset=".72" stop-color="#75634D"/><stop offset="1" stop-color="#DCC79F"/>
    </linearGradient>
    <radialGradient id="face" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#34465C"/><stop offset=".58" stop-color="#1A293B"/><stop offset="1" stop-color="#101A28"/>
    </radialGradient>
    <linearGradient id="star" x1=".2" y1=".1" x2=".85" y2=".95">
      <stop offset="0" stop-color="#FFF8E6"/><stop offset=".45" stop-color="#F0D9A7"/><stop offset="1" stop-color="#B99A67"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer raised bezel -->
  <circle cx="256" cy="256" r="211" fill="#101925" stroke="#0A111B" stroke-width="10"/>
  <circle cx="256" cy="256" r="201" fill="none" stroke="url(#rim)" stroke-width="12"/>
  <circle cx="256" cy="256" r="185" fill="url(#face)" stroke="#556174" stroke-width="2"/>
  <circle cx="256" cy="256" r="171" fill="none" stroke="#8690A0" stroke-opacity=".25" stroke-width="1.5"/>
  <!-- Fine instrument ticks with three highlighted completed milestones -->
  <g stroke="#C6B28C" stroke-linecap="round" opacity=".78">
    <path d="M256 68v15M256 429v15M68 256h15M429 256h15" stroke-width="4"/>
    <path d="M123 123l11 11M378 378l11 11M389 123l-11 11M134 378l-11 11" stroke-width="3"/>
    <path d="M196 77l4 12M316 423l4 12M77 196l12 4M423 316l12 4M316 77l-4 12M196 423l4-12M77 316l12-4M423 196l-12 4" stroke-width="2" opacity=".62"/>
  </g>
  <!-- Progress path, intentionally interrupted to read as a tracker -->
  <path d="M135 335a139 139 0 0 1 32-174" fill="none" stroke="#D7BD8E" stroke-opacity=".76" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
  <circle cx="138" cy="330" r="7" fill="#DCC99F" stroke="#182638" stroke-width="4"/>
  <circle cx="169" cy="161" r="7" fill="#DCC99F" stroke="#182638" stroke-width="4"/>
  <circle cx="371" cy="179" r="8" fill="#DCC99F" stroke="#182638" stroke-width="4"/>
  <!-- Center jewel and tapered four-point star -->
  <circle cx="256" cy="256" r="101" fill="#E7D2A6" opacity=".11" filter="url(#glow)"/>
  <path d="M256 129 C270 211 284 238 383 256 C284 274 270 301 256 383 C242 301 228 274 129 256 C228 238 242 211 256 129Z" fill="url(#star)" stroke="#FFF5D9" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M256 173v166M173 256h166" fill="none" stroke="#B99C6D" stroke-opacity=".65" stroke-width="2"/>
  <circle cx="256" cy="256" r="10" fill="#FFF8E8" stroke="#C6A978" stroke-width="3"/>
  <!-- Small inset diamond at the dial's north point -->
  <path d="M256 91l9 13-9 13-9-13z" fill="#E8D6B2" stroke="#736247" stroke-width="2"/>
</svg>
